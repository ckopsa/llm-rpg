<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>llm-rpg · sprite renderer demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        background: #10141d;
        color: #cdd6e4;
        font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      p.hint {
        margin: 0;
        font-size: 12px;
        color: #7d8aa0;
      }
      canvas {
        image-rendering: pixelated;
        max-width: 100%;
        border: 2px solid #2a3345;
        border-radius: 4px;
        background: #000;
      }
      #status.error {
        white-space: pre-wrap;
        color: #ff7b7b;
        font-size: 12px;
        max-width: 60rem;
      }
    </style>
  </head>
  <body>
    <h1>llm-rpg — sprite renderer demo</h1>
    <p class="hint">Arrow keys / WASD to walk. Water and tall grass animate; camera follows.</p>
    <div id="status">Loading sprite manifest…</div>
    <canvas id="game"></canvas>
    <p class="hint">Battler roster (rotates through all 34):</p>
    <canvas id="battlers"></canvas>
    <script type="module" src="/src/render/demo.ts"></script>
  </body>
</html>
